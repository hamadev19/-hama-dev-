<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hama Dev Store - Roblox Kurd v3.1 Supreme Mega Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered Successfully'))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>

  <style>
    :root {
      --store-primary: #10b981;
      --store-dark: #0f172a;
      --store-card: #1e293b;
      --store-border: #334155;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --robux-gold: #fbbf24;
      --admin-red: #ef4444;
      --divine-purple: #a855f7;
      --verified-blue: #00a2ff;
      --taco-orange: #f97316;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--store-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
      z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: var(--store-card); border: 1px solid var(--store-border); border-radius: 20px;
      width: 100%; max-width: 420px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center;
    }
    
    .store-logo {
      width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 16px auto;
      border: 3px solid #ff0000; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      background: linear-gradient(to bottom, #ef4444 33%, #ffffff 33%, #ffffff 66%, #22c55e 66%);
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .store-logo::before { content: "☀️"; font-size: 36px; filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }

    .auth-card h1 { font-size: 24px; margin-bottom: 4px; color: #fff; }
    .auth-card .version-tag { font-size: 11px; color: var(--robux-gold); font-weight: bold; margin-bottom: 12px; }
    .auth-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; text-align: right; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input {
      width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--store-border);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none;
    }
    .auth-btn {
      width: 100%; padding: 12px; background: var(--store-primary); border: none; border-radius: 10px;
      color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .auth-btn:hover { background: #059669; }
    .error-msg { color: var(--admin-red); font-size: 12px; margin-top: 8px; display: none; }

    .verified-badge { color: var(--verified-blue); font-size: 14px; margin-left: 4px; display: inline-flex; align-items: center; justify-content: center; }

    #global-announcement-banner {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, var(--divine-purple), var(--robux-gold)); color: white;
      padding: 14px 28px; border-radius: 30px; font-weight: bold; font-size: 15px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.9); z-index: 30000;
      display: none; align-items: center; gap: 12px; animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); } }

    #dashboard { display: none; flex: 1; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      height: 65px; background: var(--store-card); border-bottom: 1px solid var(--store-border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; color: #fff; }
    
    .brand-flag {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fbbf24;
      background: linear-gradient(to bottom, #ef4444 33%, #ffffff 33%, #ffffff 66%, #22c55e 66%);
      display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    
    .store-search { position: relative; width: 250px; }
    .store-search input {
      width: 100%; padding: 8px 36px 8px 14px; background: #0f172a; border: 1px solid var(--store-border);
      border-radius: 20px; color: white; font-size: 13px; outline: none;
    }
    .store-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .user-profile-area { display: flex; align-items: center; gap: 8px; }
    .stat-badge {
      background: #0f172a; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--store-border);
      display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 12px; color: var(--robux-gold);
    }
    .admin-badge-btn {
      background: var(--admin-red); color: white; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: none; align-items: center; gap: 5px;
    }
    .install-pwa-btn {
      background: var(--store-primary); color: white; border: none; padding: 6px 10px;
      border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .logout-btn { background: #334155; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    sidebar {
      width: 220px; background: var(--store-card); border-left: 1px solid var(--store-border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px;
      color: var(--text-muted); text-decoration: none; font-size: 14px; cursor: pointer; transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active { background: #0f172a; color: var(--store-primary); font-weight: bold; }
    .nav-item i { width: 20px; text-align: center; }

    main { flex: 1; padding: 24px; overflow-y: auto; background: var(--store-dark); }
    .page-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .store-app-card {
      background: var(--store-card); border: 1px solid var(--store-border); border-radius: 16px;
      overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: 0.3s;
    }
    .store-app-card:hover { transform: translateY(-4px); border-color: var(--store-primary); }
    .app-card-top { display: flex; gap: 12px; align-items: center; }
    .app-icon { width: 55px; height: 55px; border-radius: 12px; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--store-primary); border: 1px solid var(--store-border); }
    .app-info h3 { font-size: 15px; font-weight: bold; color: #fff; }
    .app-info p { font-size: 11px; color: var(--text-muted); }
    .install-btn {
      width: 100%; padding: 10px; background: var(--store-primary); border: none; border-radius: 8px;
      color: white; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center;
    }
    .install-btn:hover { background: #059669; }

    .friends-container { display: flex; flex-direction: column; gap: 14px; max-width: 600px; }
    .friend-add-box { background: var(--store-card); border: 1px solid var(--store-border); padding: 16px; border-radius: 14px; display: flex; gap: 10px; }
    .friend-add-box input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid var(--store-border); border-radius: 8px; color: white; outline: none; }
    .friends-list { display: flex; flex-direction: column; gap: 8px; }
    .friend-row { background: var(--store-card); border: 1px solid var(--store-border); padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .friend-info { display: flex; align-items: center; gap: 10px; }
    .online-dot { width: 10px; height: 10px; background: var(--store-primary); border-radius: 50%; box-shadow: 0 0 8px var(--store-primary); }

    .chat-box {
      background: var(--store-card); border: 1px solid var(--store-border); border-radius: 16px;
      padding: 16px; max-width: 600px; display: flex; flex-direction: column; height: 420px;
    }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-right: 5px; }
    .chat-msg { background: #0f172a; padding: 8px 12px; border-radius: 10px; font-size: 13px; border: 1px solid var(--store-border); }
    .chat-msg .sender { font-weight: bold; color: var(--store-primary); margin-bottom: 2px; }
    .chat-input-area { display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid var(--store-border); border-radius: 8px; color: white; outline: none; }

    .settings-card {
      background: var(--store-card); border: 1px solid var(--store-border); border-radius: 16px;
      padding: 24px; max-width: 600px; display: flex; flex-direction: column; gap: 16px;
    }
    .settings-card h3 { color: var(--store-primary); font-size: 18px; margin-bottom: 4px; }
    .verify-box { background: #0f172a; border: 1px solid var(--store-border); padding: 14px; border-radius: 10px; display: none; margin-top: 8px; }

    #admin-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .admin-card {
      background: var(--store-card); border: 2px solid var(--divine-purple); border-radius: 20px;
      width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.6);
    }
    .admin-card h2 { color: var(--robux-gold); display: flex; align-items: center; gap: 8px; font-size: 19px; }
    .admin-section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--store-border); padding-top: 12px; }
    .admin-section input {
      padding: 10px; background: #0f172a; border: 1px solid var(--store-border); border-radius: 8px; color: white; outline: none; font-size: 13px;
    }
    .admin-action-btn { background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--store-border); font-size: 13px; }
    .user-info-text { display: flex; flex-direction: column; gap: 2px; }
    .status-active { color: #10b981; font-size: 11px; font-weight: bold; }
    .status-banned { color: #ef4444; font-size: 11px; font-weight: bold; }
    .status-muted { color: var(--taco-orange); font-size: 11px; font-weight: bold; }
    .admin-action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .login-as-btn { background: #3b82f6; color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .give-robux-btn { background: var(--robux-gold); color: #000; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .mute-btn { background: var(--taco-orange); color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .ban-btn { background: var(--admin-red); color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

    .mutation-admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .mut-btn { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; color: #000; }

    #game-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111; z-index: 9999; display: none; flex-direction: column;
    }
    #game-canvas { width: 100%; height: 100%; display: block; }
    .game-ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
      box-sizing: border-box;
    }
    .game-top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; z-index: 10005; max-width: 100%; box-sizing: border-box; flex-wrap: wrap; gap: 8px; }
    .exit-game-btn {
      background: rgba(239, 68, 68, 0.9); color: white; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px;
    }
    .game-stats { background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 20px; font-weight: bold; display: flex; gap: 10px; color: #fff; font-size:11px; border:1px solid #444; align-items: center; flex-wrap: wrap; }
    .garden-btn-hud {
      background: var(--divine-purple); color: white; border: none; padding: 5px 10px;
      border-radius: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 4px; font-size: 11px;
    }
    .jackia-btn-hud {
      background: var(--robux-gold); color: #000; border: none; padding: 5px 10px;
      border-radius: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 4px; font-size: 11px;
    }
    .disco-btn-hud {
      background: linear-gradient(90deg, #ef4444, #3b82f6, #10b981); color: white; border: none; padding: 5px 10px;
      border-radius: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 4px; font-size: 11px;
    }

    #in-game-admin-hud {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 2px solid var(--robux-gold); color: #fff;
      padding: 12px 26px; border-radius: 20px; font-weight: bold; font-size: 15px;
      z-index: 10006; display: none; text-align: center; box-shadow: 0 0 30px rgba(251, 191, 36, 0.7);
    }

    #shop-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96); border: 2px solid var(--store-primary); border-radius: 16px;
      width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto; padding: 20px; z-index: 10008; display: none; flex-direction: column; gap: 14px; pointer-events: auto;
    }
    .shop-header { display: flex; justify-content: space-between; align-items: center; color: var(--store-primary); font-weight: bold; font-size: 15px; border-bottom: 1px solid var(--store-border); padding-bottom: 8px; }
    .shop-close { background: transparent; border: none; color: #fff; font-size: 16px; cursor: pointer; }
    .shop-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--store-border); font-size: 13px; margin-bottom: 6px; }
    .buy-btn { background: var(--robux-gold); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

    #jackia-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96); border: 2px solid var(--robux-gold); border-radius: 18px;
      width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto; padding: 22px; z-index: 10010; display: none; flex-direction: column; gap: 14px; pointer-events: auto;
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.6);
    }

    #garden-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96); border: 2px solid var(--divine-purple); border-radius: 18px;
      width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto; padding: 22px; z-index: 10009; display: none; flex-direction: column; gap: 14px; pointer-events: auto;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.5);
    }
    .garden-slot { background: #0f172a; border: 1px solid var(--store-border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .hatch-action-btn { background: var(--store-primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .pets-collected-box { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .pet-card { background: #1e293b; border: 1px solid var(--divine-purple); padding: 8px 12px; border-radius: 10px; font-size: 11px; text-align: center; }

    .mobile-controls {
      position: absolute; bottom: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: auto; z-index: 10005; max-width: 100%; box-sizing: border-box;
    }
    .dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); gap: 3px; }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 16px; touch-action: manipulation;
    }
    .jump-btn-touch {
      width: 65px; height: 65px; background: rgba(16, 185, 129, 0.85);
      border: 2px solid white; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; color: white; font-size: 22px; touch-action: manipulation;
    }

    @media (max-width: 768px) {
      sidebar { width: 70px; padding: 10px 4px; }
      .nav-item span { display: none; }
      .store-search { width: 130px; }
      .dpad { grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); }
      .jump-btn-touch { width: 55px; height: 55px; font-size: 18px; }
      .mobile-controls { bottom: 10px; left: 10px; right: 10px; }
    }
  </style>
</head>

  <!-- سیستەمی لێدانی گۆرانی و دەنگ بۆ هەمووان -->
  <audio id="game-background-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div id="global-ann
