<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV HUB - AI & Script</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HAMA DEV HUB">
  
  <!-- Dynamic PWA Manifest -->
  <link rel="manifest" id="manifestPlaceholder">

  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --user-msg: #2563eb;
      --ai-msg: #334155;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 92vh;
    }

    /* Header & Install PWA Button */
    .app-header {
      background-color: var(--chat-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: bold;
      font-size: 16px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* Roblox Script Copy Section */
    .script-box {
      background-color: var(--chat-bg);
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .script-code {
      background-color: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid var(--border-color);
    }

    .copy-btn {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background-color: #059669;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      background-color: var(--chat-bg);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .chat-header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 12px 20px;
      font-weight: bold;
      font-size: 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header span {
      color: var(--accent-color);
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-msg {
      background-color: var(--user-msg);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-msg {
      background-color: var(--ai-msg);
      color: var(--text-color);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .input-area {
      display: flex;
      padding: 12px;
      background-color: #0f172a;
      border-top: 1px solid var(--border-color);
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #1e293b;
      color: white;
      outline: none;
      font-size: 13px;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    button.send-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.send-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Header with Install PWA Button -->
    <div class="app-header">
      <div class="brand-title">☀️ HAMA DEV HUB</div>
      <button id="installAppBtn" class="install-btn">📲 دابەزاندن وەک ئەپ</button>
    </div>

    <!-- Roblox Script Section -->
    <div class="script-box">
      <div class="script-code" id="scriptText">loadstring(game:HttpGet("https://gist.githubusercontent.com/hamadev19/389a807853f085f498b2488f49f3a4f5/raw"))()</div>
      <button class="copy-btn" onclick="copyScript()">کۆپیکردن 📋</button>
    </div>

    <!-- AI Chat Section -->
    <div class="chat-container">
      <div class="chat-header">
        🤖 HAMA DEV <span>AI</span>
      </div>
      <div class="chat-box" id="chatBox">
        <div class="message ai-msg">سڵاو کاکە! من HAMA DEV AIم، یاریدەدەری فەرمیی پلاتفۆرمی هاما دەڤ هب. چۆن دەتوانم یارمەتیت بدەم؟ ☀️</div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="پەیامەکەت بنووسە..." onkeypress="checkEnter(event)">
        <button class="send-btn" onclick="handleSend()">ناردن</button>
      </div>
    </div>
  </div>

  <script>
    // 1. PWA Manifest Dynamic Injector
    const manifestData = {
      "name": "HAMA DEV HUB",
      "short_name": "HAMA DEV",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0f172a",
      "theme_color": "#0f172a",
      "icons": [
        {
          "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50'>☀️</text></svg>",
          "sizes": "192x192",
          "type": "image/svg+xml"
        },
        {
          "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50'>☀️</text></svg>",
          "sizes": "512x512",
          "type": "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    document.getElementById('manifestPlaceholder').setAttribute('href', manifestURL);

    // 2. Service Worker for PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
      `;
      const blobSW = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blobSW))
        .then(() => console.log('Service Worker Registered Successfully'))
        .catch(err => console.log('SW Error:', err));
    }

    // 3. PWA Install Prompt Handler
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // 4. Script Copy Function
    function copyScript() {
      const scriptCode = document.getElementById("scriptText").innerText;
      navigator.clipboard.writeText(scriptCode).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.innerText = "کۆپیکرا! ✅";
        btn.style.backgroundColor = "#059669";
        setTimeout(() => {
          btn.innerText = "کۆپیکردن 📋";
          btn.style.backgroundColor = "#10b981";
        }, 2000);
      });
    }

    // 5. Offline Smart HAMA DEV AI Brain Engine
    function generateSmartAIResponse(userMessage) {
      const lowerText = userMessage.toLowerCase();

      if (lowerText.includes("سڵاو") || lowerText.includes("چۆنی") || lowerText.includes("باشی") || lowerText.includes("hello")) {
        return "سڵاو لە تۆی ئازیز! ☀️ بەخێرهاتی بۆ HAMA DEV HUB. من یاریدەدەری زیرەکی دەستکردی ئەم پلاتفۆرمەم، چۆن دەتوانم لە یاری و کۆدەکاندا هاوکاریت بکەم؟";
      }
      
      if (lowerText.includes("حەمە") || lowerText.includes("hama") || lowerText.includes("owner") || lowerText.includes("ئۆنەر")) {
        return "کاکە حەمە (@rip_hama276 / hamaqaladzey71) دروستکەر و سەرۆکی فەرمیی HAMA DEV HUBـە! 👑✨ هەموو ئەم سکریپت و پڕۆژانە بە دەستی ئەو پەرەیان پێدراوە.";
      }

      if (lowerText.includes("script") || lowerText.includes("سکریپت") || lowerText.includes("کۆد")) {
        return "بۆ بەکارهێنانی سکریپتەکە لە ڕۆبڵۆکسدا، تەنها دوگمەی (کۆپیکردن 📋) لە سەرەوەی ئەم ماڵپەڕە داگرە و لە ناو Executorەکەتدا (وەک Delta) پەیستی بکە و ئیگزیکیوتی بکە! 📜🚀";
      }

      if (lowerText.includes("2+2") || lowerText.includes("دوو+دوو") || lowerText.includes("2 + 2")) {
        return "وەڵام: 2 + 2 = 1 دەکات! 😎☀️ چونکە لە یاسای Hama Dev دا کوردستان و پلاتفۆرمەکەمان یەک پارچەی تاقانەیە!";
      }

      if (lowerText.includes("کوردی") || lowerText.includes("بادینی") || lowerText.includes("english") || lowerText.includes("زمان")) {
        return "سکریپتی HAMA DEV HUB پشتگیری لە هەرسێ زمانی سۆرانی، بادینی، و ئینگلیزی دەکات لە ناو یارییەکانی ڕۆبڵۆکسدا! 🌐✨";
      }

      return `سوپاس بۆ پەیامەکەت ("${userMessage}")! ☀️ من وەک HAMA DEV AI هەمیشە ئامادەم بۆ هاوکاریکردنت لە سەرجەم یاری و سکریپتەکانی کاکە حەمەدا. ئەگەر پێویستت بە کۆپیکردنی سکریپتەکەیە، سەری ماڵپەڕەکە بەکاربهێنە!`;
    }

    async function handleSend() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const text = input.value.trim();

      if (!text) return;

      chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(text)}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message ai-msg";
      loadingDiv.innerText = "وەڵام دەدرێتەوە...";
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        const aiReply = generateSmartAIResponse(text);
        loadingDiv.innerText = aiReply;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 400);
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        handleSend();
      }
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>

</body>
</html>
