<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev AI - Smart Solver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; overflow: hidden; }
        .chat-box { flex: 1; overflow-y: auto; background-color: #1e293b; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 0.95rem; white-space: pre-wrap; }
        .user { background-color: #0284c7; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai { background-color: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid #475569; }
        .input-group { display: flex; gap: 8px; align-items: center; background-color: #1e293b; padding: 8px; border-radius: 12px; border: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 10px; border: none; background: transparent; color: white; font-size: 1rem; outline: none; }
        .upload-btn { background-color: #0284c7; color: white; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .upload-btn:hover { background-color: #0ea5e9; }
        button.send-btn { padding: 10px 18px; border-radius: 8px; border: none; background-color: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        button.send-btn:hover { background-color: #7dd3fc; }
        #imageInput { display: none; }
        .preview-box { display: none; padding: 6px 12px; background-color: #334155; border-radius: 6px; font-size: 0.8rem; color: #38bdf8; margin-bottom: 8px; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>🤖 Hama Dev AI - Smart Solver</header>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai">سڵاو! من Hama Dev AI مە. دەتوانیت هەر پرسیارێکی بیرکاری، دەرسەکانت، یان وێنەی مەسەلەیەکم بۆ بنێریت تا بە وردی و بەڕاستی بۆت حەل بکەم!</div>
        </div>
        
        <div id="previewBox" class="preview-box">
            <span id="fileName">وێنەیەک دیاری کراوە</span>
            <span style="cursor:pointer; color:#ef4444; font-weight:bold;" onclick="clearImage()">✕</span>
        </div>

        <div class="input-group">
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect()">
            <label for="imageInput" class="upload-btn" title="ناردنی وێنە">📷 ڕەسم</label>
            <input type="text" id="userInput" placeholder="پرسیارەکەت یان هاوکێشەی بیرکاری لێرە بنووسە..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        // لێرەدا کلیلی Gemini APIـکەت دادەنێیت تا بێتە حەلکەری ڕاستەقینە
        const apiKey = "API_KEY_ەکەت_لێرە_دابنێ";
        let selectedImageData = null;
        let selectedImageBase64 = null;

        function handleImageSelect() {
            const fileInput = document.getElementById('imageInput');
            const previewBox = document.getElementById('previewBox');
            const fileName = document.getElementById('fileName');

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                fileName.textContent = "📷 " + file.name;
                previewBox.style.display = "flex";

                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageData = e.target.result;
                    // بەدەستهێنانی بەشی base64 بۆ ناردن بۆ API
                    selectedImageBase64 = e.target.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            document.getElementById('imageInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
            selectedImageData = null;
            selectedImageBase64 = null;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text && !selectedImageData) return;

            // نیشاندانی پەیامی بەکارهێنەر
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            
            let contentHtml = '';
            if (text) contentHtml += `<div>${text}</div>`;
            if (selectedImageData) contentHtml += `<img src="${selectedImageData}" />`;
            userMsg.innerHTML = contentHtml;
            chatBox.appendChild(userMsg);

            const currentText = text || "تکایە شیکاری ئەم وێنەیە بکە و وەڵامم بدەوە.";
            const currentImageB64 = selectedImageBase64;
            
            input.value = '';
            clearImage();
            chatBox.scrollTop = chatBox.scrollHeight;

            // پەیامی چاوەڕوانی
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.textContent = "خەریکی بیرکردنەوە و حەلکردنم...";
            chatBox.appendChild(aiMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (apiKey === "API_KEY_ەکەت_لێرە_دابنێ" || !apiKey) {
                aiMsg.textContent = "تکایە کلیلی API (API Key) لەناو کۆدەکەدا دابنێ تا بتوانیت وەڵامی ڕاستەقینە بۆ بیرکاری و دەرسەکانت وەربگریت!";
                return;
            }

            try {
                let parts = [];
                parts.push({ text: "تۆ Hama Dev AI یت، یاریدەدەری زیرەکی تایبەتیت کە پسپۆڕی لە حەلکردنی هەموو پرسیارەکانی بیرکاری، زانستی، و دەرسەکانی قوتابیان بە زمانی کوردی بە شێوازێکی زۆر ورد و ڕوون. پرسیار یان ئەرکی بەکارهێنەر ئەمەیە: " + currentText });

                if (currentImageB64) {
                    parts.push({
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: currentImageB64
                        }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "ببۆرە، ناتوانم لەم پرسیارە تێبگەم، تکایە دووبارە هەوڵ بدەرەوە.";
                aiMsg.textContent = reply;
            } catch (error) {
                aiMsg.textContent = "کێشەیەک لە پەیوەندی لەگەڵ سێرڤەردا ڕوویدا.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
