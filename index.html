<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چات بۆتی زیرەک</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 5px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .user { background: #0084ff; color: white; align-self: flex-start; }
        .ai { background: #e4e6eb; color: black; align-self: flex-end; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #006dd7; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>چات بۆتی تایبەت بە من</h3>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="پسیارەکەت لێرە بنووسە..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">ناردن</button>
    </div>
</div>

<script>
    // لێرە کلیلی APIـەکەی خۆت دابنە لە نێوان دووانە تیترەکەدا
    const apiKey = "LIRA_API_KEY_AKAT_DANB_LERA";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();
        if (!text) return;

        // نیشاندانی پەیامی بەکارهێنەر
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // بەکارهێنانی مۆدێلی gemini-2.5-flash یان gemini-1.5-flash بۆ وەڵامدانەوە
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;

            // نیشاندانی وەڵامی AI
            chatBox.innerHTML += `<div class="message ai">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="message ai" style="color:red;">هەڵەیەک ڕوویدا، دڵنیابە لە کلیلەکەت.</div>`;
        }
    }

    function handleKey(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
