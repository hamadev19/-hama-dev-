<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA DEV HUB - چوونەژوورەوە</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .google-btn {
            background-color: #db4437;
            color: white;
        }
        .google-btn:hover {
            background-color: #c33d2e;
        }
        .guest-btn {
            background-color: #4285f4;
            color: white;
        }
        .guest-btn:hover {
            background-color: #3367d6;
        }
        #user-info {
            margin-top: 20px;
            font-size: 14px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>حەمە دەڤ هاب</h2>
        <p>تکایە بۆ بەردەوامبوون یەکێک لە ڕێگاکانی چوونەژوورەوە هەڵبژێرە:</p>
        
        <button id="google-login" class="google-btn">چوونەژوورەوە بە گووگڵ</button>
        <button id="guest-login" class="guest-btn">چوونەژوورەوە وەکو میوان (Anonymous)</button>
        
        <div id="user-info"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInAnonymously, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // زانیارییە تایبەتەکانی پڕۆژەکەت لە فایەربەیس
        const firebaseConfig = {
            apiKey: "AIzaSy...", // کلیلی ئەی پی ئای خۆت لێرە دابنێ
            authDomain: "aizasy-2e889.firebaseapp.com",
            projectId: "aizasy-2e889",
            storageBucket: "aizasy-2e889.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // دەستپێپێکردنی فایەربەیس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // دوگمەی چوونەژوورەوە بە گووگڵ
        document.getElementById('google-login').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    console.log("بە سەرکەوتوویی چووە ژوورەوە:", result.user.displayName);
                })
                .catch((error) => {
                    console.error("هەڵە لە چوونەژوورەوە:", error.message);
                    alert("هەڵە ڕوویدا: " + error.message);
                });
        });

        // دوگمەی چوونەژوورەوەی میوان
        document.getElementById('guest-login').addEventListener('click', () => {
            signInAnonymously(auth)
                .then(() => {
                    console.log("بە سەرکەوتوویی وەکو میوان چووە ژوورەوە");
                })
                .catch((error) => {
                    console.error("هەڵە لە چوونەژوورەوەی میوان:", error.message);
                    alert("هەڵە ڕوویدا: " + error.message);
                });
        0});

        // چاودێریکردنی دۆخی بەکارهێنەر
        onAuthStateChanged(auth, (user) => {
            const userInfoDiv = document.getElementById('user-info');
            if (user) {
                const name = user.isAnonymous ? "میوان (Guest)" : (user.displayName || user.email);
                userInfoDiv.innerHTML = `باری ئێستا: ژوورەوەیە (${name})`;
            } else {
                userInfoDiv.innerHTML = "تکایە بچۆرە ژوورەوە";
            }
        });
    </script>
</body>
</html>
