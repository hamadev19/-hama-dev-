<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV WEB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #00e676;
    }
    .btn-google {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    #debug-box {
      margin-top: 15px;
      font-size: 13px;
      color: #ffeb3b;
      word-break: break-all;
      background: #2c2c2c;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HAMA DEV WEB</h2>
    <div id="auth-container">
      <button id="google-btn" class="btn-google">چوونەژوورەوە بە Google</button>
    </div>
    <div id="debug-box">دۆخ: چاوەڕوانی...</div>
  </div>

  <script type="module">
    const debugBox = document.getElementById('debug-box');

    try {
      debugBox.innerText = "فایربەیز دەستی پێکرد...";
      
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js").then(async ({ initializeApp }) => {
        const { getAuth, signInWithRedirect, GoogleAuthProvider } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

        const firebaseConfig = {
          apiKey: "AIzaSyAD2e4pTOekwessoPpsa1zgwJx4eq9vD0c",
          authDomain: "aizasy-2e889.firebaseapp.com",
          projectId: "aizasy-2e889",
          storageBucket: "aizasy-2e889.firebasestorage.app",
          messagingSenderId: "503323472309",
          appId: "1:503323472309:web:7bf28bd9d9121030dd29fc",
          measurementId: "G-NCXRC9F2EW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        debugBox.innerText = "سایتەکە ئامادەیە، کلیک بکە!";

        document.getElementById('google-btn').addEventListener('click', async () => {
          debugBox.innerText = "داواکاری ڕەوانە دەکرێت...";
          try {
            await signInWithRedirect(auth, provider);
          } catch (err) {
            debugBox.innerText = "هەڵە لە کلیک: " + err.message;
            alert("هەڵە: " + err.message);
          }
        });

      }).catch(err => {
        debugBox.innerText = "هەڵەی لۆدکردنی فایربەیز: " + err.message;
      });

    } catch (e) {
      debugBox.innerText = "هەڵەی گشتی: " + e.message;
    }
  </script>

</body>
</html>
