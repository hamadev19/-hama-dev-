<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; overflow: hidden; }
        .chat-box { flex: 1; overflow-y: auto; background-color: #1e293b; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { background-color: #0284c7; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai { background-color: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border-radius: 10px; border: 1px solid #475569; background-color: #1e293b; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 12px 20px; border-radius: 10px; border: none; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>🤖 Hama Dev AI</header>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai">سڵاو! من Hama Dev AIـم. بەخێر بێیت بۆ ماڵپەڕەکەم! چۆن دەتوانم یارمەتیت بدەم؟</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="پەیامەکەت لێرە بنووسە..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            
            if (!text) return;

            // پەیامی بەکارهێنەر
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // وەڵامی AI
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = "دەستخۆش! پەیامەکەت لەلایەن Hama Dev AI وەربگیرا: " + text;
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
