<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایتی سەرەکی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 { 
            font-size: 28px; 
            margin-bottom: 15px; 
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        p { 
            font-size: 16px; 
            margin-bottom: 30px; 
            color: #e0e0e0; 
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6);
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
        }
        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✨</div>
        <h1>بەخێر بێن</h1>
        <p>ئەمە سایتی سەرەکییە، دەتوانن کلیک لە خوارەوە بکەن بۆ سەردانیکردنی وێبسایتەکە.</p>
        <a href="https://soft-sky-e98c.gokarsarok167.workers.dev/" class="btn" target="_blank">سەردانی سایت بکە</a>
    </div>
</body>
</html>
