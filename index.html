<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV - Auth Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #00e676;
    }
    .btn-google {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #ffeb3b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HAMA DEV WEB</h2>
    <div id="auth-container">
      <button id="google-btn" class="btn-google">چوونەژوورەوە بە Google</button>
    </div>
    <div id="status">ئامادەیە بۆ تاقیکردنەوە...</div>
    <div id="user-info"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      GoogleAuthProvider, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // زانیارییەکانی فایربەیزەکەت
    const firebaseConfig = {
      apiKey: "AIzaSy2e889...", // 🔥 لێرە API Key ڕاستەقینەکەی خۆت بنووسەوە
      authDomain: "aizasy-2e889.firebaseapp.com",
      projectId: "aizasy-2e889",
      storageBucket: "aizasy-2e889.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const statusDiv = document.getElementById('status');

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      const googleBtn = document.getElementById('google-btn');
      const userInfo = document.getElementById('user-info');
      const authContainer = document.getElementById('auth-container');

      // کاتێک کلیک لە دوگمەکە دەکرێت
      googleBtn.addEventListener('click', async () => {
        statusDiv.innerText = "داوای چوونەژوورەوە دەکرێت...";
        try {
          await signInWithRedirect(auth, provider);
        } catch (err) {
          statusDiv.innerText = "هەڵە: " + err.message;
          alert("هەڵە لە ڕەوانەکردن: " + err.message);
        }
      });

      // پشکنینی ئەنجامی گەڕانەوە
      getRedirectResult(auth)
        .then((result) => {
          if (result && result.user) {
            statusDiv.innerText = "چوونەژوورەوە سەرکەوتوو بوو!";
          }
        })
        .catch((error) => {
          statusDiv.innerText = "هەڵەی Redirect: " + error.message;
          alert("هەڵە: " + error.message);
        });

      // پشکنینی دۆخی بەکارهێنەر
      onAuthStateChanged(auth, (user) => {
        if (user) {
          authContainer.style.display = 'none';
          statusDiv.style.display = 'none';
          userInfo.innerHTML = `
            <h3>بەخێربیێت ${user.displayName}</h3>
            <p>${user.email}</p>
            <button id="logout-btn" style="background:#ff5252; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">دەرچوون</button>
          `;

          document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => location.reload());
          });
        }
      });

    } catch (e) {
      statusDiv.innerText = "هەڵە لە فایربەیز: " + e.message;
      alert("کێشە لە کۆنفگ: " + e.message);
    }
  </script>

</body>
</html>
