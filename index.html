<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایتی سەرەکی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 { font-size: 24px; margin-bottom: 15px; }
        p { font-size: 16px; margin-bottom: 25px; color: #ddd; }
        .btn {
            display: inline-block;
            background: #ff7e5f;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>بەخێر بێن</h1>
        <p>ئەمە سایتی سەرەکییە، بۆ وێبسایتێکی گیت هەب</p>
        <a href="https://soft-sky-e98c.gokarsarok167.workers.dev/" class="btn" target="_blank">سەردانی سایت بکە</a>
    </div>
</body>
</html>
