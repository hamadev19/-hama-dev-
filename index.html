<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA DEV HUB - AI Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #1e1e1e;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        #chat-messages {
            flex: 1;
            background: #181818;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
        }
        .ai-msg {
            background: #2d2d2d;
            color: #fff;
            margin-right: auto;
        }
        .user-msg {
            background: #4285f4;
            color: #fff;
            margin-left: auto;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #00b388;
        }
        #status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="header">حەمە دەڤ هاب - AI Assistant</div>

    <div class="chat-container">
        <div id="status">سەرقاڵی چوونەژوورەوەی خۆکار وەکو میوان...</div>
        
        <div id="chat-messages">
            <div class="message ai-msg">سڵاو کاکە حەمە! من ئەی ئای (AI)ـم. چۆن دەتوانم یارمەتیت بدەم؟</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="پەیامەکەت لێرە بنووسە..." disabled>
            <button id="send-btn" disabled>ناردن</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // زانیارییە ڕاستەقینەکانی پڕۆژەکەت
        const firebaseConfig = {
            apiKey: "AIzaSyAD2e4pTOekwessoPpsa1zgwJx4eq9vD0c",
            authDomain: "aizasy-2e889.firebaseapp.com",
            projectId: "aizasy-2e889",
            storageBucket: "aizasy-2e889.firebasestorage.app",
            messagingSenderId: "503323472309",
            appId: "1:503323472309:web:fd96d5b509e87d79dd29fc",
            measurementId: "G-9FYSRE936Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // چوونەژوورەوەی خۆکار بە بێدەنگی وەکو میوان (Anonymous)
        signInAnonymously(auth)
            .then(() => {
                console.log("بە سەرکەوتوویی وەکو میوان چووە ژوورەوە");
            })
            .catch((error) => {
                console.error("هەڵە لە چوونەژوورەوە:", error.message);
                document.getElementById('status').innerText = "هەڵە: " + error.message;
            });

        // چاودێریکردنی دۆخەکە و چالاککردنی خانەی چات
        onAuthStateChanged(auth, (user) => {
            const statusDiv = document.getElementById('status');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            if (user) {
                statusDiv.innerText = "پەیوەست بوو (میوان)";
                statusDiv.style.color = "#00ffcc";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusDiv.innerText = "چاوەڕێی چوونەژوورەوە...";
            }
        });

        // نموونەی ناردنی پەیام بۆ چات
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chatMessages = document.getElementById('chat-messages');

            // نیشاندانی پەیامی بەکارهێنەر
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-msg';
            userMsgDiv.innerText = text;
            chatMessages.appendChild(userMsgDiv);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // وەڵامی نموونەیی لەلایەن AI
            setTimeout(() => {
                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai-msg';
                aiMsgDiv.innerText = "سوپاس بۆ پەیامەکەت! من لە خزمەتتم کاکە حەمە.";
                chatMessages.appendChild(aiMsgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
