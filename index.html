<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV WEB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #00e676;
    }
    .btn {
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    .btn-google {
      background-color: #4285f4;
      color: white;
    }
    .btn-guest {
      background-color: #00e676;
      color: #121212;
    }
    #debug-box {
      margin-top: 15px;
      font-size: 13px;
      color: #ffeb3b;
      word-break: break-all;
      background: #2c2c2c;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HAMA DEV WEB</h2>
    <div id="auth-container">
      <button id="google-btn" class="btn btn-google">چوونەژوورەوە بە Google</button>
      <button id="guest-btn" class="btn btn-guest">چوونەژوورەوە بەبێ ئیمەیڵ (میوان)</button>
    </div>
    <div id="debug-box">دۆخ: چاوەڕوانی...</div>
  </div>

  <script type="module">
    const debugBox = document.getElementById('debug-box');

    try {
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js").then(async ({ initializeApp }) => {
        const { 
          getAuth, 
          signInWithRedirect, 
          signInAnonymously, 
          GoogleAuthProvider, 
          onAuthStateChanged, 
          signOut 
        } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

        // ڕێکخستنی فایربەیز بە API Key نوێیەکەت
        const firebaseConfig = {
          apiKey: "AIzaSyAD2e4pTOekwessoPpsa1zgwJx4eq9vD0c",
          authDomain: "aizasy-2e889.firebaseapp.com",
          projectId: "aizasy-2e889",
          storageBucket: "aizasy-2e889.firebasestorage.app",
          messagingSenderId: "503323472309",
          appId: "1:503323472309:web:7bf28bd9d9121030dd29fc",
          measurementId: "G-NCXRC9F2EW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        debugBox.innerText = "سایتەکە ئامادەیە!";

        // چوونەژوورەوە بە گووگڵ
        document.getElementById('google-btn').addEventListener('click', async () => {
          debugBox.innerText = "داواکاری گووگڵ ڕەوانە دەکرێت...";
          try {
            await signInWithRedirect(auth, provider);
          } catch (err) {
            debugBox.innerText = "هەڵە: " + err.message;
          }
        });

        // چوونەژوورەوە بەبێ ئیمەیڵ (میوان)
        document.getElementById('guest-btn').addEventListener('click', async () => {
          debugBox.innerText = "چوونەژوورەوە وەک میوان...";
          try {
            await signInAnonymously(auth);
          } catch (err) {
            debugBox.innerText = "هەڵە: " + err.message;
          }
        });

        // پشکنینی سەرکەوتنی چوونەژوورەوە
        onAuthStateChanged(auth, (user) => {
          if (user) {
            document.getElementById('auth-container').style.display = 'none';
            debugBox.innerText = "بە سەرکەوتوویی چوویتە ژوورەوە! ID: " + user.uid.slice(0, 10);
          }
        });

      }).catch(err => {
        debugBox.innerText = "هەڵەی فایربەیز: " + err.message;
      });

    } catch (e) {
      debugBox.innerText = "هەڵە: " + e.message;
    }
  </script>

</body>
</html>
