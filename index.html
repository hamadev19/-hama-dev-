<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV WEB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #00e676;
    }
    .btn-google {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-google:hover {
      background-color: #357ae8;
    }
    #user-info {
      margin-top: 20px;
      word-break: break-all;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HAMA DEV WEB</h2>
    <div id="auth-container">
      <button id="google-btn" class="btn-google">چوونەژوورەوە بە Google</button>
    </div>
    <div id="user-info"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      GoogleAuthProvider, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // زانیارییەکانی فایربەیزەکەی تۆ (بە دروستی لێرە جێگیر کراون)
    const firebaseConfig = {
      apiKey: "AIzaSyAD2e4pTOekwessoPpsa1zgwJx4eq9vD0c",
      authDomain: "aizasy-2e889.firebaseapp.com",
      projectId: "aizasy-2e889",
      storageBucket: "aizasy-2e889.firebasestorage.app",
      messagingSenderId: "503323472309",
      appId: "1:503323472309:web:7bf28bd9d9121030dd29fc",
      measurementId: "G-NCXRC9F2EW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const googleBtn = document.getElementById('google-btn');
    const userInfo = document.getElementById('user-info');
    const authContainer = document.getElementById('auth-container');

    // کاتێک کلیک لە دوگمەکە دەکرێت
    googleBtn.addEventListener('click', () => {
      signInWithRedirect(auth, provider);
    });

    // پشکنینی گەڕانەوە دوای هەڵبژاردنی ئیمەیڵ
    getRedirectResult(auth)
      .then((result) => {
        if (result && result.user) {
          console.log("بە سەرکەوتوویی چوویتە ژوورەوە:", result.user);
        }
      })
      .catch((error) => {
        console.error("هەڵە:", error);
      });

    // پیشاندانی زانیاری بەکارهێنەر ئەگەر چووبێتە ژوورەوە
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.style.display = 'none';
        userInfo.innerHTML = `
          <img class="avatar" src="${user.photoURL}" alt="Profile">
          <h3>بەخێربیێت ${user.displayName}</h3>
          <p>${user.email}</p>
          <button id="logout-btn" style="background:#ff5252; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin-top:10px;">دەرچوون</button>
        `;

        document.getElementById('logout-btn').addEventListener('click', () => {
          signOut(auth).then(() => {
            location.reload();
          });
        });
      } else {
        authContainer.style.display = 'block';
        userInfo.innerHTML = '';
      }
    });
  </script>

</body>
</html>
