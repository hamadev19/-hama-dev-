<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV HUB</title>
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: 50px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .status {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>

  <!-- بەستنەوەی فایربەیز بە شێوازی CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <div class="card">
    <h2>HAMA DEV HUB</h2>
    <p id="status-text" class="status">چاوەڕوان بە... دەستپێکردنی فایربەیز</p>
  </div>

  <script>
    // زانیارییە تایبەتەکانی فایربەیزەکەت
    const firebaseConfig = {
      apiKey: "AIzaSyAD2e4pTOekwessoPpsa1zgwJx4eeq9VD0c",
      authDomain: "alzasy-2e889.firebaseapp.com",
      projectId: "alzasy-2e889",
      storageBucket: "alzasy-2e889.appspot.com",
      messagingSenderId: "503323472309",
      appId: "1:503323472309:web:7bf28bd9d9121030dd29fc",
      measurementId: "G-NCXRC9F2EW"
    };

    // چالاککردنی فایربەیز
    try {
      firebase.initializeApp(firebaseConfig);
      document.getElementById("status-text").innerText = "فایربەیز بە سەرکەوتوویی بەستراوە! 🚀";
      document.getElementById("status-text").style.color = "#4ade80";
    } catch (error) {
      document.getElementById("status-text").innerText = "هەڵە ڕوویدا: " + error.message;
      document.getElementById("status-text").style.color = "#f87171";
    }
  </script>

</body>
</html>
