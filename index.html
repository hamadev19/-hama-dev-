<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMA DEV HUB</title>
  <style>
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 10px;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn-google {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: 0.2s;
    }
    .btn-google:hover {
      background-color: #e6e6e6;
    }
    #error-msg {
      color: #f85149;
      margin-top: 15px;
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>HAMA DEV HUB</h1>
    <p>تکایە بە گووگڵ بچۆ ژوورەوە بۆ بەکارهێنانی ئەپەکە:</p>
    
    <button class="btn-google" id="login-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.45 15.96 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.2-.58-.31-1.2-.31-1.8s.11-1.22.31-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.04.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/></svg>
      چوونەژوورەوە بە Google
    </button>

    <div id="error-msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAD2e4pToEkvk3L6U4T6R0X8e6...",
      authDomain: "aizasy-2e889.firebaseapp.com",
      projectId: "aizasy-2e889",
      storageBucket: "aizasy-2e889.appspot.com",
      messagingSenderId: "503323472309",
      appId: "1:503323472309:web:fd96d5b509e87d79dd2f9c",
      measurementId: "G-9F9SRE9J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("login-btn");
    const errorMsg = document.getElementById("error-msg");

    loginBtn.addEventListener("click", () => {
      signInWithRedirect(auth, provider);
    });

    getRedirectResult(auth)
      .then((result) => {
        if (result) {
          alert("بە سەرکەوتوویی چوویە ژوورەوە وەک: " + result.user.displayName);
        }
      })
      .catch((error) => {
        errorMsg.innerText = "هەڵە: " + error.code + " - " + error.message;
      });
  </script>
</body>
</html>
