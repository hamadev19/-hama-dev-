
<script>
    // ئەم ناونیشانە بە لینکی Worker ـەکەت بگۆڕە
    const WORKER_URL =
        "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev/api/chat";

    const sendButton = document.getElementById("send-btn");
    const input = document.getElementById("user-input");
    const chatMessages = document.getElementById("chat-messages");

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendMessage();
    });

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        sendButton.disabled = true;

        const userMsg = document.createElement("div");
        userMsg.className = "message user-msg";
        userMsg.innerText = text;
        chatMessages.appendChild(userMsg);

        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai-msg";
        aiMsg.innerText = "چاوەڕێ بکە...";
        chatMessages.appendChild(aiMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "هەڵە لە پەیوەندی");
            }

            aiMsg.innerText = data.reply || "وەڵام نەگەڕایەوە.";
        } catch (error) {
            aiMsg.innerText =
                "ببورە کاکە، هەڵەیەک ڕوویدا: " + error.message;
        } finally {
            sendButton.disabled = false;
            chatMessages.scrollTop = chatMessages.scrollHeight;
            input.focus();
        }
    }
</script>
